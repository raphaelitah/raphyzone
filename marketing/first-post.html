<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}

.logo{width:300px;height:300px;margin-bottom:90px;filter:drop-shadow(0 30px 60px rgba(80,72,229,.6))}
h1{font-size:128px;font-weight:800;letter-spacing:-4px;line-height:1}

p{font-size:46px;margin-top:40px;color:#c9c8d8;line-height:1.35;max-width:800px}

name: Coaching Quality Expert

# Three complementary checks, all writing to reports/coaching-quality-log.md:
#   - audit: a static data audit over the catalog (scripts/coaching-quality-audit.mjs)
#     — no browser, checks nonsensical prescriptions, mis-modeled structure, duration
#     vs. structure mismatches, and equipment assigned to an athlete that they don't
#     actually own.
#   - agent: logs into the real app as the dedicated qa-coach@raphyzone.dev account
#     and actually executes real catalog workouts through the UI like a human athlete
#     would (scripts/coaching-quality-agent.mjs) — real weight/feedback logging, real
#     rest-transition checks — and narrates a verdict per workout.
#   - equipment-fuzz: drives the real generateWeeklyPlan edge function for the
#     seeded test-athlete@raphyzone.dev account across a deliberately varied set
#     of equipment profiles (scripts/coaching-quality-equipment-fuzz.mjs), so an
#     equipment-matching bug that only manifests for an unusual gear combo no
#     real athlete happens to have gets caught — the audit job's equipment check
#     only ever sees whichever profile real athletes already have.
# audit/agent run weekly and on demand; equipment-fuzz runs daily (one
# profile/day, see below) and on demand. None duplicates the regular e2e job,
# which only checks that the UI/DB mechanically work, not whether a workout
# makes sense.
#
# audit/agent are weekly, not nightly: the workout catalog is static (edited
# deliberately, not on any schedule), so the duration/prescription/sequencing/
# structure checks only produce a new finding when someone edits the catalog
# — nightly runs were just re-confirming "still 0".
#
# equipment-fuzz has NO schedule for now: it's testing generator code
# (supabase/functions/_shared/planContext.ts) and equipment taxonomy
# (EQUIPMENT_GROUPS / exercise.equipment_tags) for regressions, but during the
# beta the workout/exercise catalog and equipment taxonomy are frozen (real
# users run on the existing catalog only) — nothing exercises that code path,
# so a recurring run would just re-confirm "still 0". Trigger it manually
# (workflow_dispatch) once catalog/generator work resumes, or any time
# planContext.ts changes. The script itself still only runs 1 of its 9
# profiles per invocation by default (date-rotated) to stay under the LLM
# provider's daily request cap; use the equipment_profile input below to
# force a specific one, or re-dispatch on 9 consecutive days to sweep all of
# them.
on:
  schedule:
    - cron: '0 7 * * 1' # audit + agent: 07:00 UTC every Monday
  workflow_dispatch:
    inputs:
      equipment_profile:
        description: 'equipment-fuzz: force a specific profile (name from ALL_PROFILES in the script); leave blank to use the date-rotated default'
        required: false
        type: string

concurrency:
  group: coaching-quality
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    name: Run static catalog audit
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record report log baseline
        run: .github/scripts/record-coaching-log-baseline.sh
      - run: npm run audit:coaching-quality
        id: audit
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Commit updated report log
        run: .github/scripts/commit-coaching-log.sh "Coaching quality audit"
      - name: Fail the job if the audit found anomalies
        if: steps.audit.outcome == 'failure'
        run: exit 1

  agent:
    name: Run live workout-execution agent
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * 1'
    runs-on: ubuntu-latest
    # Runs in parallel with `audit`/`equipment-fuzz`, not after them:
    # commit-coaching-log.sh already handles concurrent commits to
    # reports/coaching-quality-log.md itself (fetch, hard-reset to
    # origin/main, re-append just this job's new bytes, retry up to 5x on a
    # push race), so serializing the jobs isn't needed for correctness — it
    # was just adding the slowest job's runtime on top of the other two.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium binary
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # A cache hit restores the downloaded browser binary but not the apt-installed
      # OS deps (those aren't under ~/.cache/ms-playwright and don't persist across
      # runners), so still run install-deps on its own — much faster than the full
      # install, which re-downloads Chromium every time.
      - name: Install Playwright Chromium (+ OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Start dev server
        run: npm run dev &
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 2
          done
          echo "Dev server did not come up in time" >&2
          exit 1
      - name: Record report log baseline
        run: .github/scripts/record-coaching-log-baseline.sh
      # Smaller per-run batch (was 15) shortens this job at the cost of more
      # weekly runs to churn through the full catalog — fine since a
      # workout is only re-reviewed when it's new or has changed anyway.
      - run: node scripts/coaching-quality-agent.mjs 8
        id: agent
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASE_URL: http://localhost:5173
      - name: Commit updated report log
        run: .github/scripts/commit-coaching-log.sh "Coaching quality agent run"
      - name: Fail the job if the agent flagged anything
        if: steps.agent.outcome == 'failure'
        run: exit 1

  equipment-fuzz:
    name: Run plan-generator equipment fuzz test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Runs in parallel with `audit`/`agent` — see the comment on the `agent`
    # job for why serializing on report-log commits isn't needed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record report log baseline
        run: .github/scripts/record-coaching-log-baseline.sh
      - run: npm run fuzz:coaching-quality-equipment
        id: equipment-fuzz
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FUZZ_PROFILE: ${{ github.event.inputs.equipment_profile }}
      - name: Commit updated report log
        run: .github/scripts/commit-coaching-log.sh "Coaching quality equipment fuzz run"
      - name: Fail the job if the fuzz run found anomalies
        if: steps.equipment-fuzz.outcome == 'failure'
        run: exit 1

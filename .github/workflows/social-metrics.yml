name: Instagram metrics

# Thursdays 18:00 UTC, the day before the Friday writer: pull lifetime insights for every
# published post into social_weekly_metrics so the writer and the admin page can see what
# performs. Needs repo secrets SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, INSTAGRAM_ACCESS_TOKEN
# (the token needs the instagram_business_manage_insights permission).
on:
  schedule:
    - cron: '0 18 * * 4'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (print metrics, write nothing)'
        type: boolean
        default: false

concurrency: social-metrics

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/social/pull-metrics.mjs ${{ inputs.dry && '--dry' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
